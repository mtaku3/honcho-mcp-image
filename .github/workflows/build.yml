name: Build Honcho MCP image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mtaku3/honcho-mcp
  # plastic-labs/honcho commit; the image is built from its mcp/ directory.
  HONCHO_REF: 3326373c35f6538fb3b7af97803abe328c5aafb4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/plastic-labs/honcho.git#${{ env.HONCHO_REF }}:mcp
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.HONCHO_REF }}
          labels: org.opencontainers.image.source=https://github.com/mtaku3/honcho-mcp-image
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
